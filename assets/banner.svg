<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#12092b" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Synthwave Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="30%" stop-color="#ff3388" />
      <stop offset="70%" stop-color="#8800ff" />
      <stop offset="100%" stop-color="#12092b" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Text Gradients -->
    <linearGradient id="vicePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#ff73b3" />
      <stop offset="100%" stop-color="#ff2a85" />
    </linearGradient>

    <linearGradient id="viceCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#70f8ff" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="synthGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ff2a85" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Retro Grid Floor (Perspective) -->
  <g opacity="0.7">
    <rect y="240" width="1200" height="160" fill="url(#synthGrid)" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6" filter="url(#glowCyan)" />
  </g>

  <!-- Retro Sunset Circle -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="140" fill="url(#sunGrad)" />
    <!-- Sun Horizontal Blinds -->
    <rect x="-140" y="-30" width="280" height="4" fill="#0c071d" />
    <rect x="-140" y="-12" width="280" height="6" fill="#0c071d" />
    <rect x="-140" y="8" width="280" height="8" fill="#0c071d" />
    <rect x="-140" y="30" width="280" height="12" fill="#0c071d" />
    <rect x="-140" y="54" width="280" height="16" fill="#0c071d" />
    <rect x="-140" y="82" width="280" height="20" fill="#0c071d" />
    <rect x="-140" y="112" width="280" height="24" fill="#0c071d" />
  </g>

  <!-- Stylized Palm Tree Silhouettes -->
  <!-- Left Palm -->
  <g transform="translate(180, 250) scale(0.85)" opacity="0.9">
    <path d="M 0 160 Q 20 60 50 0 Q 35 70 20 160 Z" fill="#070312" />
    <!-- Fronds -->
    <path d="M 50 0 Q 0 -60 -80 -30 Q -20 -30 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 20 -80 -40 -80 Q 0 -40 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 80 -90 120 -60 Q 80 -40 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 110 -50 160 -10 Q 100 0 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 90 20 130 50 Q 80 30 50 0 Z" fill="#070312" />
  </g>

  <!-- Right Palm -->
  <g transform="translate(1020, 250) scale(-0.85, 0.85)" opacity="0.9">
    <path d="M 0 160 Q 20 60 50 0 Q 35 70 20 160 Z" fill="#070312" />
    <path d="M 50 0 Q 0 -60 -80 -30 Q -20 -30 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 20 -80 -40 -80 Q 0 -40 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 80 -90 120 -60 Q 80 -40 50 0 Z" fill="#070312" />
    <path d="M 50 0 Q 110 -50 160 -10 Q 100 0 50 0 Z" fill="#070312" />
  </g>

  <!-- Camera / Reel / Play Icon Badge -->
  <g transform="translate(600, 95)">
    <circle cx="0" cy="0" r="38" fill="#150a2e" stroke="#00f0ff" stroke-width="2.5" filter="url(#glowCyan)" />
    <!-- Play Triangle -->
    <polygon points="-8,-16 16,0 -8,16" fill="url(#vicePink)" filter="url(#glowPink)" />
  </g>

  <!-- Main Title: VICECLIP -->
  <text x="600" y="195" 
        font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
        font-size="68" 
        font-weight="900" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="url(#vicePink)" 
        filter="url(#glowPink)">
    VICECLIP
  </text>

  <!-- Subtitle: ARCHIVER -->
  <text x="600" y="240" 
        font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="14" 
        text-anchor="middle" 
        fill="url(#viceCyan)" 
        filter="url(#glowCyan)">
    ARCHIVER
  </text>

  <!-- Platform Badges in Header -->
  <g transform="translate(600, 345)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <!-- Tagline -->
    <text x="0" y="0" fill="#ffffff" opacity="0.9" letter-spacing="1.5">
      VIRAL GTA 6 VIDEO DISCOVERY &amp; ARCHIVAL ENGINE
    </text>
    <text x="0" y="24" fill="#a0aec0" font-size="12" letter-spacing="2">
      YOUTUBE • REDDIT • FACEBOOK • NON-DRM • COMPLIANCE FIRST
    </text>
  </g>

  <!-- Subtle Border Highlights -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#ff2a85" stroke-width="1.5" stroke-opacity="0.3" />
</svg>
