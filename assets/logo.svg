<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b38" />
      <stop offset="100%" stop-color="#0a0518" />
    </linearGradient>
    <linearGradient id="logoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#ff73b3" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="5" y="5" width="190" height="190" rx="42" fill="url(#logoBg)" stroke="url(#logoCyan)" stroke-width="3" filter="url(#logoGlow)" />

  <!-- Sunset Semi-circle -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="55" fill="url(#logoPink)" />
    <!-- Blinds -->
    <rect x="-55" y="-10" width="110" height="3" fill="#0a0518" />
    <rect x="-55" y="4" width="110" height="4" fill="#0a0518" />
    <rect x="-55" y="19" width="110" height="6" fill="#0a0518" />
    <rect x="-55" y="36" width="110" height="9" fill="#0a0518" />

    <!-- Palm Silhouette -->
    <path d="M 0 55 Q 10 20 20 -10 Q 15 25 10 55 Z" fill="#0a0518" />
    <path d="M 20 -10 Q -5 -30 -35 -20 Q -10 -15 20 -10 Z" fill="#0a0518" />
    <path d="M 20 -10 Q 15 -40 0 -45 Q 10 -25 20 -10 Z" fill="#0a0518" />
    <path d="M 20 -10 Q 40 -45 55 -30 Q 35 -20 20 -10 Z" fill="#0a0518" />
    <path d="M 20 -10 Q 55 -20 65 0 Q 45 -5 20 -10 Z" fill="#0a0518" />

    <!-- Play Button Overlay -->
    <circle cx="0" cy="0" r="26" fill="#0a0518" stroke="#00f0ff" stroke-width="2.5" />
    <polygon points="-5,-11 11,0 -5,11" fill="url(#logoPink)" />
  </g>
</svg>
