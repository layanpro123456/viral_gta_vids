[discovery]
keywords = ["GTA 6", "Grand Theft Auto VI", "#GTA6", "Vice City"]
exclude_keywords = ["prank", "mod showcase", "clickbait", "gta 5"]
max_age_hours = 48
min_virality_score = 3.5
weight_views = 0.7
weight_engagement = 0.3

[archiver]
output_dir = "./archive"
max_resolution = 1080
max_duration_seconds = 300
concurrent_downloads = 2
rate_limit_sleep_seconds = 2

[database]
db_path = "./viceclip.db"

[facebook]
page_ids = ["GTA6News", "RockstarGames"]

