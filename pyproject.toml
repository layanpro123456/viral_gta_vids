[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viceclip"
version = "0.1.0"
description = "ViceClip Archiver: Automated discovery, ranking, and archival tool for trending GTA 6 clips"
readme = "README.md"
authors = [
    { name = "ViceClip Team" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "yt-dlp>=2024.4.0",
    "customtkinter>=6.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
viceclip = "viceclip.cli.main:app"
viceclip-gui = "viceclip.gui.app:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
