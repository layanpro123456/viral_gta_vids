name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0 or latest)'
        required: true
        default: 'v0.1.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Desktop App & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools & Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyinstaller customtkinter pillow rich yt-dlp httpx pydantic pydantic-settings pytest pytest-cov respx typer
          pip install -e .

      - name: Run Test Suite
        shell: pwsh
        run: |
          pytest -v

      - name: Build Standalone Windows Executable
        shell: pwsh
        run: |
          python build_desktop.py

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path dist/ViceClipArchiver.exe -Algorithm SHA256).Hash
          Set-Content -Path dist/ViceClipArchiver.exe.sha256 -Value $hash
          Write-Host "ViceClipArchiver.exe SHA-256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ViceClipArchiver-Windows
          path: |
            dist/ViceClipArchiver.exe
            dist/ViceClipArchiver.exe.sha256
          retention-days: 90

      - name: Resolve Release Tag
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "${{ github.event.inputs.tag_name }}"
            if (-not $tag) { $tag = "v0.1.0" }
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "ViceClip Archiver ${{ steps.vars.outputs.tag }}"
          files: |
            dist/ViceClipArchiver.exe
            dist/ViceClipArchiver.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ViceClip Archiver Desktop & Engine Release 🌴🚗

            ### Download Standalone Application
            - **[ViceClipArchiver.exe](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/ViceClipArchiver.exe)** (Portable Windows Executable)
            - **ViceClipArchiver.exe.sha256** (Integrity Checksum)

            *No Python installation required. Simply download and double-click to launch the dark-mode synthwave desktop app.*
